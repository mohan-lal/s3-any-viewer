name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Generate fixtures (smoke-tests the parsers used at build time)
        run: npm run fixtures

      - name: Validate manifest
        run: node -e "const m=require('./dist/manifest.json'); if(m.manifest_version!==3) throw new Error('MV3 expected'); console.log(m.name, m.version)"

      - name: Package
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: s3-any-viewer-${{ github.sha }}
          path: release/*.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
