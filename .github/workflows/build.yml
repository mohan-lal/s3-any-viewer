name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write        # create the GitHub Release on tags
  id-token: write        # sign the build provenance attestation
  attestations: write    # store the attestation

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Generate fixtures (smoke-tests the parsers used at build time)
        run: npm run fixtures

      - name: Validate manifest
        run: node -e "const m=require('./dist/manifest.json'); if(m.manifest_version!==3) throw new Error('MV3 expected'); console.log(m.name, m.version)"

      - name: Package
        run: npm run package

      - name: Per-file checksums
        run: |
          (cd dist && find . -type f | sort | xargs sha256sum) > release/SHA256SUMS.txt
          sha256sum release/*.zip >> release/SHA256SUMS.txt
          cat release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: s3-any-viewer-${{ github.sha }}
          path: release/*

      - name: Build provenance attestation
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body: |
            Built by GitHub Actions from `${{ github.sha }}`.

            Verify the package:
            ```
            gh attestation verify s3-any-viewer-*.zip --owner ${{ github.repository_owner }}
            ```
            `SHA256SUMS.txt` lists the hash of every file inside the package and of the zip. See SECURITY.md for comparing against an installed copy.
